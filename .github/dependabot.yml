version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    labels: [dependencies, github_actions]
    groups:
      actions-maintenance:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    labels: [dependencies, python:uv]
    groups:
      ruff-minor-review:
        patterns: [ruff]
        update-types: [minor]
      ty-minor-review:
        patterns: [ty]
        update-types: [minor]
      uv-maintenance:
        patterns: ["*"]
        update-types: [patch]