name: validate

# Action pins, centralized via YAML anchors. `uses:` cannot take ${{ }}
# expressions, so anchors are the only way to keep one pinned SHA shared by
# every job — update these in one place and the two jobs stay in sync.
x-checkout: &checkout actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
x-setup-python: &setup-python actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
x-setup-uv: &setup-uv astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ["v*.*.*"]
    # Docs-only changes never trigger the full matrix; README changes are
    # covered by pr-open runs and the weekly schedule below.
    paths: &ci_paths
      - ".github/**"
      - "pyproject.toml"
      - "uv.lock"
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - ".githooks/**"
  pull_request:
  schedule:
    # GitHub can delay or drop scheduled workflows at the start of an hour,
    # so the run is offset a few minutes in.
    - cron: "17 9 * * 1" # weekly: Monday 09:17 UTC

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ${{ vars.RUNNER_X86_64 || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: *checkout
        with:
          persist-credentials: false
      - uses: *setup-python
        with:
          python-version: "3.14"
      - uses: *setup-uv
        with:
          version: "0.11.7"
          enable-cache: true
      - name: Sync locked dev environment
        run: uv sync --locked
      - name: Shellcheck hooks
        run: shellcheck .githooks/pre-commit .githooks/commit-msg
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run ty check
      - name: Tests
        run: uv run pytest
      - name: Docs contract
        run: uv run python scripts/validate-docs.py
      - name: External URL check (scheduled only)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: uv run python scripts/verify-urls.py

  python-compat:
    runs-on: ${{ vars.RUNNER_X86_64 || 'ubuntu-latest' }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: *checkout
        with:
          persist-credentials: false
      - uses: *setup-python
        with:
          python-version: ${{ matrix.python-version }}
      - name: Stdlib test runner across versions
        run: PYTHONPATH=src python3 -m unittest discover -s tests