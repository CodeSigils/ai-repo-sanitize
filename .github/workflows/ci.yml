name: validate

# Action pins: each job pins the same SHAs explicitly. GitHub Actions does
# not support YAML anchors/aliases in workflow files (see RESEARCH.md), so a
# pin update means updating every occurrence — keep the `# vX.Y.Z` comments
# in lock-step across the quality and python-compat jobs.

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ["v*.*.*"]
  pull_request:
  schedule:
    # GitHub can delay or drop scheduled workflows at the start of an hour,
    # so the run is offset a few minutes in.
    - cron: "17 9 * * 1" # weekly: Monday 09:17 UTC

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ${{ vars.RUNNER_X86_64 || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.7"
          enable-cache: true
      - name: Sync locked dev environment
        run: uv sync --locked
      - name: Commit-message policy on pushes
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' && github.ref_type == 'branch'
        run: uv run python scripts/check-commit-messages.py --base "${{ github.event.before }}" --head "${{ github.sha }}"
      - name: Commit-message policy on pull requests
        if: github.event_name == 'pull_request'
        env:
          ACTOR: ${{ github.actor }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$ACTOR" = "dependabot[bot]" ]; then
            uv run python scripts/check-commit-messages.py --base "$BASE" --head "$HEAD" --allow-bodyless
          else
            uv run python scripts/check-commit-messages.py --base "$BASE" --head "$HEAD"
          fi
      - name: Shellcheck hooks
        run: shellcheck .githooks/pre-commit .githooks/commit-msg
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run ty check
      - name: Tests
        run: uv run pytest
      - name: Docs contract
        run: uv run python scripts/validate-docs.py
      - name: Doc coverage warning on pushes (datadef-style)
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: uv run python scripts/check-doc-coverage.py --base "${{ github.event.before }}" --head "${{ github.sha }}"
      - name: Doc coverage warning on pull requests (datadef-style)
        if: github.event_name == 'pull_request'
        run: uv run python scripts/check-doc-coverage.py --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha }}"
      - name: Doc claims check (codocia-class)
        run: uv run python scripts/check-doc-claims.py
      - name: External URL check (scheduled only)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: uv run python scripts/verify-urls.py

  python-compat:
    runs-on: ${{ vars.RUNNER_X86_64 || 'ubuntu-latest' }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Stdlib test runner across versions
        run: PYTHONPATH=src python3 -m unittest discover -s tests
