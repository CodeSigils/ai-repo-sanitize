name: validate

# Action pins: each job pins the same SHAs explicitly. GitHub's docs now
# describe basic YAML anchor/alias support, but anchors are empirically
# unreliable here (an anchor-based workflow was rejected with "workflow file
# issue" and zero jobs; see RESEARCH.md §2), so a pin update means updating
# every occurrence — keep the `# vX.Y.Z` comments in lock-step across the
# quality and python-compat jobs.

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ["v*.*.*"]
  pull_request:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ${{ vars.RUNNER_X86_64 || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.7"
          enable-cache: true
      - name: Sync locked dev environment
        run: uv sync --locked
      - name: Commit-message policy on pushes
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' && github.ref_type == 'branch'
        env:
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          HEAD_AUTHOR: ${{ github.event.head_commit.author.name }}
        # Squash-merged Dependabot PRs land as commits authored by
        # dependabot[bot] with no what/why labels; the pull-request path below
        # already exempts them from body labels (never from attribution
        # checks), so the push path mirrors that exemption via the head
        # commit's author. Found by the first bot merge cycle (2026-10-20).
        run: |
          if [ "$HEAD_AUTHOR" = "dependabot[bot]" ]; then
            uv run python scripts/check-commit-messages.py --base "$BEFORE" --head "$HEAD_SHA" --allow-bodyless
          else
            uv run python scripts/check-commit-messages.py --base "$BEFORE" --head "$HEAD_SHA"
          fi
      - name: Commit-message policy on pull requests
        if: github.event_name == 'pull_request'
        env:
          ACTOR: ${{ github.actor }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$ACTOR" = "dependabot[bot]" ]; then
            uv run python scripts/check-commit-messages.py --base "$BASE" --head "$HEAD" --allow-bodyless
          else
            uv run python scripts/check-commit-messages.py --base "$BASE" --head "$HEAD"
          fi
      - name: Shellcheck hooks
        run: shellcheck .githooks/pre-commit .githooks/commit-msg
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run ty check
      - name: Tests
        run: uv run pytest
      - name: Docs contract
        run: uv run python scripts/validate-docs.py
      - name: Doc coverage warning on pushes (datadef-style)
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: uv run python scripts/check-doc-coverage.py --base "${{ github.event.before }}" --head "${{ github.sha }}"
      - name: Doc coverage warning on pull requests (datadef-style)
        if: github.event_name == 'pull_request'
        run: uv run python scripts/check-doc-coverage.py --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha }}"
      - name: Doc claims check (codocia-class)
        run: uv run python scripts/check-doc-claims.py
  python-compat:
    runs-on: ${{ vars.RUNNER_X86_64 || 'ubuntu-latest' }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Stdlib test runner across versions
        run: PYTHONPATH=src python3 -m unittest discover -s tests
