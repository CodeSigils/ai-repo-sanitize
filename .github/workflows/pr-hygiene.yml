name: pr hygiene

on:
  workflow_dispatch:
  schedule:
    - cron: "29 9 * * *" # daily, offset from the top of the hour

permissions:
  contents: read
  pull-requests: read

jobs:
  hygiene:
    runs-on: ${{ vars.RUNNER_X86_64 || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Report pull-request hygiene
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check-pr-hygiene.py
