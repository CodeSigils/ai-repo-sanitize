name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ vars.RUNNER_X86_64 || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.7"
          enable-cache: true
      - name: Sync locked dev environment
        run: uv sync --locked
      - name: Build distributions
        run: uv build
      - name: Create GitHub Release
        # gh is preinstalled on runners; GITHUB_REF_NAME is the triggering tag.
        # gh in Actions needs the token passed explicitly (auto-provisioned
        # tokens are not picked up otherwise - failed with exit code 4).
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes