name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  verify-release:
    runs-on: ${{ vars.RUNNER_X86_64 || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.7"
          enable-cache: true
      - name: Sync locked dev environment
        run: uv sync --locked
      - name: Confirm the tag is reachable from master
        run: git merge-base --is-ancestor "${GITHUB_SHA}^{}" origin/master
      - name: Shellcheck hooks
        run: shellcheck .githooks/pre-commit .githooks/commit-msg
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run ty check
      - name: Tests
        run: uv run pytest
      - name: Docs contract
        run: uv run python scripts/validate-docs.py
      - name: Doc claims check (codocia-class)
        run: uv run python scripts/check-doc-claims.py

  release:
    needs: verify-release
    permissions:
      contents: write
    runs-on: ${{ vars.RUNNER_X86_64 || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.7"
          enable-cache: true
      - name: Sync locked dev environment
        run: uv sync --locked
      - name: Build distributions
        run: uv build
      - name: Create GitHub Release
        # gh is preinstalled on runners; GITHUB_REF_NAME is the triggering tag.
        # gh in Actions needs the token passed explicitly (auto-provisioned
        # tokens are not picked up otherwise - failed with exit code 4).
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
